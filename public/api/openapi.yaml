        hr_decision_by: {type: integer, nullable: true}
        created_at: {type: string}
    Department:
      type: object
      properties: {id: {type: integer}, name: {type: string}, faculty_id: {type: integer}, faculty_name: {type: string}, head_name: {type: string, nullable: true}, employees_count: {type: integer}}
    Position:
      type: object
      properties: {id: {type: integer}, title: {type: string}, category: {type: string, enum: [academic, administrative, support]}}
    StaffNumbers:
      type: object
      properties: {total: {type: integer}, academic: {type: integer}, with_degree: {type: integer}, on_leave: {type: integer}}
    StaffRow:
      allOf:
        - {$ref: '#/components/schemas/StaffNumbers'}
        - type: object
          properties: {department_id: {type: integer}, department_name: {type: string}, faculty_name: {type: string}}
