# =====================================================================
# Nginx + PHP-FPM для university-hr
# Файл: /etc/nginx/sites-available/university-hr
# Включение: sudo ln -s /etc/nginx/sites-available/university-hr /etc/nginx/sites-enabled/
# Проверка:  sudo nginx -t && sudo systemctl reload nginx
# Замените hr.example.tj на свой домен (3 места) и php8.3 на свою версию PHP.
# Подробно: docs/16-deploy.md
# =====================================================================

# HTTP → HTTPS: все запросы по 80 порту перенаправляем на защищённый адрес
server {
    listen 80;
    listen [::]:80;
    server_name hr.example.tj;

    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 ставит Nginx 1.24. В Nginx >= 1.25.1 вместо «http2» в listen
    # пишут отдельную строку «http2 on;» (старый вариант тоже работает, но с предупреждением)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hr.example.tj;

    # Сертификат Let's Encrypt (получается командой certbot, см. docs/16-deploy.md)
    ssl_certificate     /etc/letsencrypt/live/hr.example.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.example.tj/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # DocumentRoot — ТОЛЬКО папка public. src/, config/, views/ снаружи недоступны.
    root  /var/www/university-hr/public;
    index index.php;
    charset utf-8;

    # Максимальный размер запроса (фото до 2 МБ + поля формы); в php.ini post_max_size не меньше
    client_max_body_size 8m;

    # Заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/university-hr.access.log;
    error_log  /var/log/nginx/university-hr.error.log;

    # Скрытые файлы (.htaccess, .gitkeep, .env) не отдаём
    location ~ /\. {
        deny all;
    }

    # Front controller: если файла нет — запрос уходит в index.php (так работают «красивые» адреса)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Выполняем ТОЛЬКО index.php. Любой другой .php (например, загруженный в uploads/) — 404
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTPS on;
        # Настройки можно передать переменными окружения вместо config/config.php:
        # fastcgi_param APP_DEBUG 0;
    }
    location ~ \.php$ {
        return 404;
    }

    # Статика: CSS, JS, шрифты, фото — с кэшированием в браузере
    location ~* \.(css|js|png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
