<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новая заявка на отпуск — Кадровая система</title>
  <!-- Шрифт Inter с кириллицей (русские буквы) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3 из CDN; integrity защищает от подмены файла -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
<!-- Шапка: на узком экране меню сворачивается в кнопку-«гамбургер» -->
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand" href="layout.html">ХПИ ТТУ · Кадры</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="layout.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="employees.html">Сотрудники</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Кафедры</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="leave-form.html">Отпуска</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Отчёт</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2 text-white">
        <span>hr</span>
        <span class="badge role-badge">Отдел кадров</span>
        <button type="button" class="btn btn-sm btn-outline-light">Выйти</button>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4" style="max-width: 720px">
  <h1 class="mb-4">Новая заявка на отпуск</h1>

  <!-- novalidate: стандартные «пузыри» браузера отключены, сообщения показывает app.js.
       Сервер (PHP) всё равно проверяет каждое поле заново! -->
  <form id="leave-form" class="card card-body" method="post" action="/leaves/create" novalidate>
    <div class="mb-3">
      <label class="form-label" for="leave-type">Тип отпуска *</label>
      <select class="form-select" id="leave-type" name="type" required aria-describedby="leave-type-error">
        <option value="">Выберите тип</option>
        <option value="annual">Ежегодный</option>
        <option value="study">Учебный</option>
        <option value="unpaid">Без сохранения з/п</option>
        <option value="sick">По болезни</option>
      </select>
      <div class="invalid-feedback" id="leave-type-error"></div>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-sm-6">
        <label class="form-label" for="start-date">Дата начала *</label>
        <input class="form-control" type="date" id="start-date" name="start_date" required aria-describedby="start-date-error">
        <div class="invalid-feedback" id="start-date-error"></div>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="end-date">Дата окончания *</label>
        <input class="form-control" type="date" id="end-date" name="end_date" required aria-describedby="end-date-error">
        <div class="invalid-feedback" id="end-date-error"></div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="reason">Причина / комментарий</label>
      <textarea class="form-control" id="reason" name="reason" rows="3" maxlength="255" aria-describedby="reason-error"></textarea>
      <div class="invalid-feedback" id="reason-error"></div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Отправить на согласование</button>
      <a class="btn btn-outline-secondary" href="layout.html">Отмена</a>
    </div>
  </form>
</main>

<footer class="app-footer container py-4 text-center">
  © 2026 Учебный проект university-hr · все данные вымышлены
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script type="module" src="../assets/js/app.js"></script>
</body>
</html>
