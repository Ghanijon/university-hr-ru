<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новый сотрудник — Кадровая система</title>
  <!-- Шрифт Inter с кириллицей (русские буквы) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3 из CDN; integrity защищает от подмены файла -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
<!-- Шапка: на узком экране меню сворачивается в кнопку-«гамбургер» -->
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand" href="layout.html">ХПИ ТТУ · Кадры</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="layout.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="employees.html">Сотрудники</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Кафедры</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Отпуска</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Отчёт</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2 text-white">
        <span>hr</span>
        <span class="badge role-badge">Отдел кадров</span>
        <button type="button" class="btn btn-sm btn-outline-light">Выйти</button>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4" style="max-width: 960px">
  <h1 class="mb-4">Новый сотрудник</h1>

  <!-- Здесь работает встроенная проверка HTML5 (required, maxlength, type="email", pattern).
       Свою проверку на JavaScript мы пишем для формы заявки на отпуск (leave-form.html). -->
  <form class="card card-body" method="post" action="#" enctype="multipart/form-data">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="last_name">Фамилия *</label>
        <input class="form-control" id="last_name" name="last_name" required maxlength="60">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="first_name">Имя *</label>
        <input class="form-control" id="first_name" name="first_name" required maxlength="60">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="middle_name">Отчество</label>
        <input class="form-control" id="middle_name" name="middle_name" maxlength="60">
      </div>

      <div class="col-md-4">
        <label class="form-label" for="birth_date">Дата рождения *</label>
        <input class="form-control" type="date" id="birth_date" name="birth_date" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="gender">Пол *</label>
        <select class="form-select" id="gender" name="gender" required>
          <option value="">— выберите —</option>
          <option value="m">Мужской</option>
          <option value="f">Женский</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="academic_degree">Учёная степень</label>
        <select class="form-select" id="academic_degree" name="academic_degree">
          <option value="none">Нет</option>
          <option value="candidate">Кандидат наук</option>
          <option value="doctor">Доктор наук</option>
          <option value="phd">PhD</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="phone">Телефон</label>
        <input class="form-control" type="tel" id="phone" name="phone" maxlength="20" placeholder="+992 92 123 45 67"
               pattern="[0-9+\(\)\s\-]{5,20}">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" type="email" id="email" name="email" maxlength="120" placeholder="name@example.tj">
      </div>

      <div class="col-md-6">
        <label class="form-label" for="department_id">Кафедра *</label>
        <select class="form-select" id="department_id" name="department_id" required>
          <option value="">— выберите кафедру —</option>
          <option value="1">Кафедра программирования и информационных систем</option>
          <option value="2">Кафедра сетей связи и систем коммутации</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="position_id">Должность *</label>
        <select class="form-select" id="position_id" name="position_id" required>
          <option value="">— выберите должность —</option>
          <option value="3">Доцент</option>
          <option value="4">Старший преподаватель</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="hire_date">Дата приёма *</label>
        <input class="form-control" type="date" id="hire_date" name="hire_date" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="photo">Фото</label>
        <input class="form-control" type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp"
              >
        <div class="form-text">JPEG, PNG или WebP, не более 2 МБ</div>
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit">Сохранить</button>
      <a class="btn btn-outline-secondary" href="employees.html">Отмена</a>
    </div>
  </form>
</main>

<footer class="app-footer container py-4 text-center">
  © 2026 Учебный проект university-hr · все данные вымышлены
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

<script type="module" src="../assets/js/app.js"></script>
</body>
</html>
